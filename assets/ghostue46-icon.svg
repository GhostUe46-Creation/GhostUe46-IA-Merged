<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="GhostUe46">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8fcff"/>
      <stop offset="45%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="glass" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#bae6fd" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="body" x1="30%" y1="10%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#f0fdff"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="shine" cx="35%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b"/>
      <feOffset dy="2" result="o"/>
      <feColorMatrix in="o" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.35  0 0 0 0 0.55  0 0 0 0.25 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded app tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#sky)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Soft bubbles -->
  <circle cx="24" cy="28" r="5" fill="#ffffff" opacity="0.55"/>
  <circle cx="104" cy="36" r="7" fill="#ffffff" opacity="0.35"/>
  <circle cx="96" cy="98" r="4.5" fill="#a7f3d0" opacity="0.55"/>
  <circle cx="30" cy="96" r="3.5" fill="#ffffff" opacity="0.4"/>

  <!-- Ghost body (water droplet + soft ghost) -->
  <g filter="url(#soft)">
    <path d="M64 22
             C48 22 36 36 36 54
             C36 70 42 82 48 92
             C50 95 48 100 44 102
             C48 100 52 98 56 100
             C58 102 60 106 64 106
             C68 106 70 102 72 100
             C76 98 80 100 84 102
             C80 100 78 95 80 92
             C86 82 92 70 92 54
             C92 36 80 22 64 22Z"
          fill="url(#body)" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.85"/>
    <!-- Glass highlight -->
    <ellipse cx="52" cy="44" rx="14" ry="18" fill="url(#shine)"/>
    <!-- Eyes -->
    <circle cx="54" cy="56" r="5.5" fill="#0c4a6e"/>
    <circle cx="74" cy="56" r="5.5" fill="#0c4a6e"/>
    <circle cx="55.5" cy="54.5" r="2" fill="#ffffff"/>
    <circle cx="75.5" cy="54.5" r="2" fill="#ffffff"/>
    <!-- Soft smile -->
    <path d="M54 70 Q64 78 74 70" fill="none" stroke="#0c4a6e" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Water rim spark -->
  <path d="M78 34 C82 30 90 32 88 40" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
</svg>
